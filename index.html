/* Layout: a dark reading room, the book centered, a slim control bar underneath */
:root{
  --room:#071a3a; --room2:#0d3b78; --bar:#0a2146; --ink:#14213d; --paper:#f8f9fc; --paper-edge:#e6eaf3;
  --gold:#f5c542; --gold-deep:#b9861a; --sea:#2cc5d9; --mute:#6b7a99; --onroom:#e8f0ff;
  --display:'Poppins',system-ui,sans-serif; --body:'Courier Prime','Courier New',monospace; --serif:'Lora',Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 90% at 50% 0%,var(--room2) 0%,var(--room) 62%);color:var(--onroom);font-family:var(--display);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;overflow:hidden}
#stage{position:relative;z-index:1;flex:1;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;padding-block:14px 6px}
#book{width:100%;height:100%}
.stf__parent{margin:0 auto}

/* pages */
.pg{container-type:inline-size;background:var(--paper);color:var(--ink);overflow:hidden;position:relative}
.pg.L{background:linear-gradient(90deg,#f8f9fc 0%,#f8f9fc 86%,#e9edf6 100%)}
.pg.R{background:linear-gradient(270deg,#f8f9fc 0%,#f8f9fc 86%,#e9edf6 100%)}
.pg.hard{background:#071a3a}
.pg.hard img{display:block;width:100%;height:100%;object-fit:cover}
.in{position:absolute;left:10cqw;right:10cqw;top:9cqw;bottom:12cqw;overflow:hidden;font:400 3.05cqw/1.6 var(--body);hyphens:auto;-webkit-hyphens:auto}
.meas{position:fixed;left:-9999px;top:0;width:550px;height:778px;visibility:hidden}
.meas .in{bottom:14cqw}
.in p{margin:0;text-indent:1.6em;text-wrap:pretty}
.in p.nc,.in p.first{text-indent:0}
.in p.dlg{text-indent:0;margin-top:.25em}
.ch{text-align:center;margin:3cqw 0 5cqw}
.chn{font:600 2.4cqw/1 var(--display);letter-spacing:.42em;text-transform:uppercase;color:var(--gold-deep);margin-bottom:2.6cqw;padding-left:.42em}
.ch h2{font:700 6.4cqw/1.12 var(--display);margin:0;color:var(--ink);text-wrap:balance;letter-spacing:-.005em}
.ch .rule{width:11cqw;height:.7cqw;background:var(--gold);margin:3.6cqw auto 0;border-radius:1cqw}
.dc{float:left;font:700 12.4cqw/.78 var(--display);color:var(--gold-deep);padding:1.1cqw 1.6cqw 0 0;margin-top:.5cqw}
.sub{text-align:center;font:600 2.5cqw/1 var(--display);letter-spacing:.3em;text-transform:uppercase;color:var(--mute);margin:3.4cqw 0 2.4cqw;padding-left:.3em}
.sep{text-align:center;color:var(--gold-deep);letter-spacing:.7em;margin:1.2em 0;padding-left:.7em}
.ill{margin:2.2cqw 0 2.8cqw}
.ill .fr{border-radius:1.6cqw;overflow:hidden;box-shadow:0 0 0 .35cqw #dfe5f2;line-height:0}
.ill svg{display:block;width:100%;height:auto}
.ill figcaption{margin-top:1.6cqw;text-align:center;font:italic 400 2.6cqw/1.35 var(--serif);color:var(--mute)}
.fo{position:absolute;left:0;right:0;bottom:5cqw;text-align:center;font:500 2.4cqw/1 var(--display);color:var(--mute);letter-spacing:.2em}
.moral{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:5cqw;padding:0 14cqw}
.moral .mk{font:600 2.4cqw/1 var(--display);letter-spacing:.42em;text-transform:uppercase;color:var(--gold-deep);padding-left:.42em}
.moral blockquote{margin:0;font:italic 400 5.6cqw/1.4 var(--serif);color:var(--ink);text-wrap:balance}
.moral blockquote::before{content:"";display:block;width:11cqw;height:.7cqw;background:var(--gold);margin:0 auto 5cqw;border-radius:1cqw}
.moral .end{font:700 3cqw/1.2 var(--body);letter-spacing:.14em;color:var(--ink);margin-top:3cqw}
.title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 12cqw;gap:3.4cqw}
.title .k{font:600 2.3cqw/1 var(--display);letter-spacing:.42em;color:var(--gold-deep);padding-left:.42em}
.title h1{margin:0;font:700 9.4cqw/1.04 var(--display);text-transform:uppercase;color:var(--ink)}
.title h1 span{color:var(--gold-deep);display:block}
.title .rule{width:16cqw;height:.8cqw;background:var(--gold);border-radius:1cqw}
.title .sub2{font:italic 400 4cqw/1.3 var(--serif);color:var(--mute)}
.title .by{margin-top:6cqw;font:500 2.4cqw/1.7 var(--display);letter-spacing:.22em;color:var(--mute);text-transform:uppercase}

<script type="application/json" id="story">[{"t": "part", "n": "SATU", "title": "Anak yang Tak Bisa Diam"}, {"t": "ill", "id": "c1"}, {"t": "p", "text": "Bekasi, 10 Oktober 2008. Pada hari itu, lahirlah seorang anak laki-laki yang diberi nama Muhammad Galang. Sejak kecil, Galang dikenal sebagai anak yang sangat aktif. Ia tidak bisa diam. Berlari, melompat, melakukan berbagai percobaan, dan bermain adalah kesehariannya. Bahkan, beberapa kali ia mengalami cedera hingga harus dibawa ke IGD karena ulahnya."}, {"t": "p", "text": "\"Nak, hati-hati! Nanti jatuh lagi,\" kata Bunda."}, {"t": "p", "text": "\"Aman aja, Bun. Nggak sakit, kok,\" jawab Galang, padahal kakinya baru saja lecet."}, {"t": "p", "text": "Sejak kecil, Galang sudah dididik untuk mandiri dan berani. Hal itu terlihat ketika ia masuk taman kanak-kanak. Pada hari pertama sekolah, ia masih ditunggui orang tuanya. Namun, pada hari kedua, ketiga, dan seterusnya, ia sudah tidak ditunggui lagi. Ini membuktikan bahwa Galang adalah anak yang berani dan mandiri."}, {"t": "p", "text": "Galang juga termasuk anak yang pandai bergaul. Saat SD, ia punya banyak sahabat, di antaranya Rudi, Brian, dan Dimas."}, {"t": "part", "n": "DUA", "title": "Bosan Bolak-balik Lintasan"}, {"t": "ill", "id": "c2"}, {"t": "p", "text": "Menginjak kelas satu SD, Galang bergabung dengan klub renang BOA di kotanya. Bunda sengaja mendaftarkannya untuk menyalurkan energi Galang yang sangat aktif. Sejak saat itu, hari-hari Galang mulai disibukkan dengan sekolah dan renang."}, {"t": "p", "text": "Saat pertama kali diajak Bunda datang ke klub, Galang kagum melihat kemampuan anak-anak klub berenang. Wah, mereka bisa berenang dengan cepat dan bertenaga sekali! Itulah yang ada di pikiran Galang. Ia pun berbisik kepada Bunda."}, {"t": "p", "text": "\"Bun, itu cepat banget berenangnya. Aku pengin kayak gitu,\" kata Galang."}, {"t": "p", "text": "\"Kamu pasti bisa, Nak, kalau mau berlatih,\" jawab Bunda."}, {"t": "p", "text": "Kata-kata itu membuat Galang semangat berlatih. Setahun pertama bergabung di klub renang, semangat Galang masih membara. Pulang sekolah, ia hanya istirahat sebentar, lalu langsung berangkat ke kolam. Program demi program dari pelatih ia selesaikan dengan baik."}, {"t": "p", "text": "Namun, saat kelas tiga SD, Galang mulai bosan dengan renang. Setiap kali hendak berangkat latihan, ia selalu enggan. Beragam alasan ia karang: pusing, lelah, atau banyak tugas sekolah. Padahal, pelatih sudah menyarankan Galang untuk ikut lomba renang. Bunda mencoba berbagai cara untuk membujuknya. Namun, pada akhirnya Galang tidak ikut lomba karena jatuh sakit."}, {"t": "p", "text": "Pada suatu malam, sepulang latihan renang, Galang bercerita kepada Bunda."}, {"t": "p", "text": "\"Bun, berenang itu nggak seru. Cuma bolak-balik lintasan gitu doang. Aku mau olahraga yang lebih seru,\" kata Galang."}, {"t": "p", "text": "Bunda terdiam. Ia bingung harus menjawab apa."}, {"t": "p", "text": "Di sekolah, Galang mulai sering bermain futsal bersama Rudi, Brian, dan Dimas. Malam berikutnya, ia kembali bercerita kepada Bunda dengan wajah berseri-seri."}, {"t": "p", "text": "\"Bun, futsal lebih seru, lho! Ada lawannya, mainnya bareng tim, nggak cuma bolak-balik lintasan doang,\" kata Galang."}, {"t": "p", "text": "Dari cerita itu, Bunda mulai mengerti. Galang menyukai olahraga beregu yang seru dan ada lawannya. Namun, Bunda juga tidak ingin kemampuan renang Galang terbuang sia-sia. Bunda pun punya sebuah ide."}, {"t": "part", "n": "TIGA", "title": "Jatuh Cinta pada Polo Air"}, {"t": "ill", "id": "c3"}, {"t": "p", "text": "Malam berikutnya, Bunda menghampiri Galang di kamarnya."}, {"t": "p", "text": "\"Galang mau ikut nggak besok nonton sama Bunda?\" tanya Bunda."}, {"t": "p", "text": "\"Nonton apa, Bun?\" tanya Galang."}, {"t": "p", "text": "\"Rahasia,\" jawab Bunda sambil tersenyum."}, {"t": "p", "text": "Ternyata, Bunda mengajak Galang menonton polo air. Itulah pertama kalinya Galang melihat olahraga polo air, dan matanya langsung berbinar-binar."}, {"t": "p", "text": "Pertandingan yang ia tonton adalah Jayakarta melawan Jambi. Saat itu, pertandingan sudah memasuki babak keempat. Waktu hanya tersisa empat menit. Skor 0–5 untuk keunggulan Jambi."}, {"t": "p", "text": "Tiba-tiba, Jambi mendapat penalti. Namun, kiper Jayakarta berhasil menyelamatkannya! Jayakarta langsung melakukan serangan balik yang bagus dan berhasil menjebol gawang Jambi. Ternyata, satu gol itu menjadi titik balik. Hanya dalam tiga menit, Jayakarta menyamakan skor menjadi 5–5. Pertandingan dilanjutkan ke adu penalti, dan akhirnya Jayakarta menang."}, {"t": "p", "text": "\"Bun, ini seru banget! Ada renangnya, ada timnya, ada lawannya juga!\" seru Galang."}, {"t": "p", "text": "Pertandingan itu membuat Galang tertarik dengan polo air. Ia pun bergabung dengan klub JAQ. Di sana, ia berlatih dengan sungguh-sungguh dan disiplin."}, {"t": "p", "text": "Di JAQ, Galang punya teman bernama Kamran. Mereka menjadi sahabat baik di polo air. Pertemuan mereka terjadi karena memiliki hobi yang sama, yaitu sama-sama suka bermain bola dan olahraga body contact. Hal itulah yang membuat mereka cocok."}, {"t": "part", "n": "EMPAT", "title": "Nama yang Tak Tercantum"}, {"t": "ill", "id": "c4"}, {"t": "p", "text": "Pada suatu hari, Galang melihat daftar pemain untuk pertandingan berikutnya. Ia membacanya dari atas ke bawah, tetapi namanya tidak ada. Ia mengulangnya terus-menerus, tetap saja tidak ada."}, {"t": "p", "text": "Sementara itu, ia melihat nama Kamran, sahabatnya, tercantum di sana. Kamran merasa senang karena dirinya terpilih, sementara nama Galang tidak ada. Betapa sedihnya Galang saat itu. Ia sadar bahwa dirinya ternyata masih payah dan masih jauh dari impiannya menjadi pemain timnas."}, {"t": "p", "text": "\"Hah, di klub aja nggak kepilih, gimana di timnas?\" gumam Galang."}, {"t": "p", "text": "Saat itu, ia terus bertanya dalam hati. Kenapa aku mengejar cita-citaku? Kenapa aku ingin jadi atlet polo air? Kenapa aku ingin masuk timnas? Hanya itu isi pikirannya. Ia merasa gagal. Ia merasa perjuangannya sia-sia."}, {"t": "p", "text": "Hingga pada suatu hari, Galang mendapat pelajaran berharga dari gurunya di sekolah. Gurunya menjelaskan tentang kegagalan. Saat itu, Galang merasa kata-kata gurunya seperti ditujukan untuk dirinya."}, {"t": "p", "text": "\"Anak-anak, kadang-kadang hidup kita tidak selalu mulus, tidak selalu seperti yang kita harapkan. Kita bahkan harus belajar bagaimana rasanya gagal dan kalah. Makanya, jangan menyerah hanya karena gagal sekali. Mungkin kalian harus memperbaiki diri dan berjuang lebih keras lagi,\" kata gurunya."}, {"t": "p", "text": "Galang pun mencoba membaca kisah tentang atlet favoritnya, Alvaro Granados, pemain polo air asal Spanyol. Dari situ, ia sadar bahwa perjuangannya belum ada apa-apanya, tetapi ia sudah merasa gagal. Lama-lama, Galang bingung kepada dirinya sendiri. Kenapa ia menyerah? Kenapa ia merasa gagal? Padahal, waktu masih ada dan semuanya belum berakhir."}, {"t": "p", "text": "Suatu siang, Kamran datang ke rumah Galang. Kebetulan, hanya ada Galang di rumah."}, {"t": "p", "text": "\"Lang, kenapa kamu nggak latihan lagi?\" tanya Kamran."}, {"t": "p", "text": "\"Kam, mau latihan gimana pun, aku juga nggak akan kepilih tim,\" jawab Galang."}, {"t": "p", "text": "\"Lang, jangan nyerah dulu. Masih ada waktu untuk memperbaiki diri. Nggak usah nyerah duluan,\" kata Kamran."}, {"t": "p", "text": "Kata-kata Kamran membuat Galang kembali bersemangat."}, {"t": "part", "n": "LIMA", "title": "Bangkit Kembali"}, {"t": "ill", "id": "c5"}, {"t": "p", "text": "Setelah menemukan tekadnya kembali, Galang pun berlatih dengan semangat dan ceria. Ia tidak lagi sedih. Ia bahkan berlatih fisik agar ketahanannya saat bermain semakin kuat. Ia benar-benar mengusahakan yang terbaik."}, {"t": "p", "text": "Kadang-kadang, Galang begitu lelah sampai kakinya tidak kuat menopang badannya untuk berdiri. Lelah, nyeri, dan kesemutan sudah biasa ia rasakan. Bahkan, kadang-kadang ia memasang koyo di kakinya agar rasa lelah dan nyerinya hilang."}, {"t": "p", "text": "Akhirnya, perjuangan Galang terbayar. Ia berhasil masuk tim JAQ U-12 yang akan diturunkan dalam pertandingan, bahkan menjadi pemain tim utama tepat di usianya yang ke-12."}, {"t": "p", "text": "Saat pertandingan, Galang tampil sangat bagus bersama JAQ. Ia mencetak gol dan memberi assist untuk teman-temannya. Walaupun begitu, ia tidak pernah merasa puas karena selalu mengingat pesan Bunda: \"Di atas langit masih ada langit.\""}, {"t": "p", "text": "Pesan itu selalu ia ingat agar ia tidak pernah merasa puas atau merasa lebih baik daripada orang lain. Ia justru merasa masih memiliki kekurangan. Karena itu, ia sangat menghargai rekan setimnya. Ia selalu menganggap setiap orang di timnya punya kelebihan dan kekurangan masing-masing."}, {"t": "part", "n": "ENAM", "title": "Sang Kapten"}, {"t": "ill", "id": "c6"}, {"t": "p", "text": "Perjalanan Galang tidak berhenti sampai di situ. Masih ada Jakarta Akuatik Grand Prix, perlombaan bergengsi yang akan diikuti Galang bersama timnya di kategori umur 12 tahun. Kejuaraan ini adalah kejuaraan internasional, dan akan ada peserta dari luar negeri. Tim Galang sudah mempersiapkan diri, bahkan mengundang tim lain untuk pertandingan uji coba."}, {"t": "p", "text": "Namun, ada satu hal yang tidak disangka Galang: ia ditunjuk menjadi kapten tim! Galang kaget sekaligus senang. Ternyata, pelatih melihat perjuangan dan kedisiplinan Galang selama ini. Tentu saja Galang juga sangat gugup. Ini lomba besar, ditambah lagi ia adalah kapten. Namun, Galang tahu ia harus siap menghadapi tim apa pun, dan apa pun hasilnya harus ia terima."}, {"t": "sep"}, {"t": "p", "text": "Hari pertama Jakarta Akuatik Grand Prix pun tiba. Untuk pertama kalinya, Galang memimpin timnya sebagai kapten. Lawan pertama mereka adalah Kusuma Harapan, juara tahun lalu. Pertandingan berlangsung sangat sengit. Kedua tim saling jual beli serangan. Setelah empat babak, skor akhir 7–7. Hasil itu membuat JAQ masih aman di peringkat kedua grup."}, {"t": "p", "text": "Pada pertandingan kedua di babak grup, lawan JAQ adalah Pesut Biru, tim asal Surabaya. Pertandingan berlangsung sangat sengit dengan banyak serangan balik. Di pertandingan inilah Galang merasakan bagaimana rasanya menjadi kapten. Saat JAQ melakukan serangan balik, pemain-pemain Pesut Biru menarik baju dan celana pemain JAQ, bahkan sedikit mencakarnya. Pemain JAQ langsung marah. Tugas Galang adalah menenangkan timnya agar tidak tersulut emosi."}, {"t": "p", "text": "\"Jangan terpancing emosi! Itu cuma bikin kita kalah,\" kata Galang. Kapten Pesut Biru pun melakukan hal yang sama kepada timnya."}, {"t": "p", "text": "JAQ memegang bola dan memainkan operan-operan yang sangat baik, sementara Pesut Biru mencoba bertahan habis-habisan. Suara komentator terdengar di seluruh arena."}, {"t": "p", "text": "\"Bertahan di menit akhir ... oh, bola ke pemain nomor 7 dari JAQ, Galang! Oh, dia menembak dan ... GOOOL!\""}, {"t": "p", "text": "Begitulah komentator menggambarkan gol dramatis di menit akhir itu. Gol tersebut membuat JAQ menjadi pemuncak grup dengan 4 poin."}, {"t": "p", "text": "Pada pertandingan ketiga di babak grup, JAQ harus menghadapi tim dari luar negeri, yaitu KL Water Polo, finalis tahun lalu. Pada babak pertama dan kedua, KL Water Polo berhasil unggul lima gol. Sebelum babak ketiga dimulai, Galang berkata kepada timnya."}, {"t": "p", "text": "\"Guys, ayo! Masih ada waktu, kita masih bisa ngejar. Jangan nyerah duluan. Kita pasti bisa kalau masih mau berusaha!\""}, {"t": "p", "text": "Di dua babak selanjutnya, JAQ terus menyerang. Mereka tahu, jika kalah, mereka harus pulang dan tidak akan lolos ke delapan besar. Hal yang terasa mustahil pun terjadi. Hanya dalam delapan menit, JAQ berhasil mengungguli KL Water Polo. Peluit panjang berbunyi, dan JAQ berhasil come back! Kemenangan itu adalah hasil kerja sama dan kekompakan tim. JAQ menutup babak grup di posisi kedua, di bawah Kusuma Harapan dan di atas KL Water Polo serta Pesut Biru."}, {"t": "p", "text": "Di perempat final, JAQ tampil luar biasa. Lawan mereka adalah Cakalang Bandung. JAQ membuktikan bahwa merekalah yang pantas melaju ke semifinal. Mereka tidak memberi satu pun kesempatan bagi lawan untuk melepaskan tembakan, hingga skor menjadi 7–1 untuk kemenangan JAQ."}, {"t": "p", "text": "Di semifinal, JAQ menghadapi tim kuat, Bandung Water Polo Club. Pertandingan berlangsung sangat sengit. Sampai babak ketiga, skor masih imbang 8–8. Namun, di babak keempat, para pemain Bandung mulai kelelahan. Saat itulah JAQ menggempur habis-habisan dan menang 12–9."}, {"t": "part", "n": "TUJUH", "title": "Final yang Menegangkan"}, {"t": "ill", "id": "c7"}, {"t": "p", "text": "Akhirnya, JAQ mencapai final, sesuatu yang tadinya terasa mustahil. Lawan mereka di final adalah tim yang sangat kuat, Akuatik Legawa."}, {"t": "p", "text": "Upacara pembukaan final dimulai. Ketegangan terasa bukan hanya di tim JAQ, tetapi juga di tim Akuatik Legawa. Semua pemain benar-benar tegang sampai bulu kuduk mereka berdiri. Melihat timnya tegang, pelatih memberikan pengarahan, lalu berbicara kepada Galang."}, {"t": "p", "text": "\"Kamu harus bisa memimpin timmu, ya. Kamu kapten. Saya yakin kamu orang yang pantas menjadi kapten. Pertandingan kali ini pasti sangat sengit dan akan menguji mentalmu, karena Akuatik Legawa punya banyak pendukung,\" kata pelatih."}, {"t": "p", "text": "\"Siap, Coach! Saya siap dengan apa pun hasilnya nanti,\" jawab Galang."}, {"t": "p", "text": "Pertandingan akan segera dimulai. Para pemain JAQ masuk ke kolam untuk pemanasan. Setelah itu, pelatih membagikan topi kepada para pemain. Galang pun berkata kepada teman-temannya."}, {"t": "p", "text": "\"Apa pun hasilnya, kita sudah berjuang dan sudah melakukan yang terbaik. Jadi, kalau kalah, tegakkan kepala kalian. Kita masih bisa!\""}, {"t": "sub", "text": "Babak Pertama"}, {"t": "p", "text": "PRIIIT! Peluit awal pertandingan berbunyi. JAQ mengawali pertandingan dengan sangat baik. Mereka menyerang, tetapi Akuatik Legawa juga membalas. Kedua tim sama-sama menyerang dan bertahan. Skor babak pertama 2–2."}, {"t": "sub", "text": "Babak Kedua"}, {"t": "p", "text": "Di babak kedua, kedua tim bermain lebih berani. Serangan demi serangan dilakukan oleh JAQ dan Akuatik Legawa, tetapi skor masih imbang 4–4. Pertandingan benar-benar sengit. Belum ada tim yang bisa memimpin."}, {"t": "sub", "text": "Babak Ketiga"}, {"t": "p", "text": "Babak ketiga dimulai. Kedua tim terus saling menyerang. Setiap kali satu tim mencetak gol, tim lain langsung membalas. Skor masih 7–7. Sebelum babak keempat dimulai, Galang berkata kepada timnya."}, {"t": "p", "text": "\"Ayo, guys! Kita masih punya peluang. Kita harus buktikan kalau kita bisa. Apa pun hasilnya, kita terima!\""}, {"t": "ill", "id": "c7b"}, {"t": "sub", "text": "Babak Terakhir"}, {"t": "p", "text": "Di babak terakhir, JAQ tampil lebih mengerikan. Mereka bermain habis-habisan. Akuatik Legawa juga tidak mau kalah. Kedua tim sama-sama menyerang, hingga skor mencapai 12–12. Lalu, terjadilah sesuatu yang membuat JAQ menang."}, {"t": "p", "text": "\"Oh, skor masih 12–12! Pertandingan yang sangat sengit antara JAQ dan Akuatik Legawa. Waktu hanya tersisa tujuh detik lagi. JAQ masih menguasai bola. Operan-operan yang sangat baik dilakukan oleh Galang dan Kamran ... oh, bola dioper ke Galang! Dia menembak dan ... GOOOL! Gol di detik terakhir memastikan kemenangan JAQ! Medali emas untuk JAQ!\" teriak komentator."}, {"t": "p", "text": "Setelah pertandingan, semua pemain JAQ bersorak gembira. Mereka sangat senang karena berhasil menjadi juara. Mereka tinggal menunggu penyerahan medali."}, {"t": "part", "n": "DELAPAN", "title": "Merah Putih di Tangan Galang"}, {"t": "ill", "id": "c8"}, {"t": "p", "text": "Saat penyerahan medali, salah seorang panitia menghampiri Galang."}, {"t": "p", "text": "\"Kamu Galang, ya? Kapten JAQ?\" tanya bapak itu."}, {"t": "p", "text": "\"Iya, Pak,\" jawab Galang."}, {"t": "p", "text": "\"Selamat, kamu masuk seleksi timnas U-12. Ini suratnya. Tolong datang nanti, ya,\" kata bapak itu."}, {"t": "p", "text": "Betapa kagetnya Galang. Ia akan ikut seleksi timnas! Ia langsung memberi tahu Bunda."}, {"t": "p", "text": "\"Bun, aku nanti bakal ikut seleksi timnas!\" kata Galang."}, {"t": "p", "text": "\"Oh, ya? Selamat, ya, Nak!\" kata Bunda sambil memeluknya."}, {"t": "p", "text": "Saat seleksi berlangsung, rasanya semuanya terbayar. Kaki yang sakit dan pegal, juga tangisan saat tidak masuk tim, semuanya terbayar. Ketika namanya diumumkan, Galang dinyatakan lulus seleksi. Ia begitu senang karena semua perjuangannya terbayar."}, {"t": "p", "text": "Malam itu, di kamarnya, Galang memegang jaket merah putih yang nanti akan ia kenakan saat bertanding. Ia mengingat-ingat masa-masa ketika ia tidak masuk tim, juga tangan dan kaki yang pegal tak karuan. Di situ ia tahu bahwa tidak ada hasil tanpa proses. Proses yang baik akan menghasilkan hasil yang baik."}, {"t": "p", "text": "Dari mewakili BOA, lalu mewakili JAQ, perjuangan Galang akhirnya terbayar dengan mewakili Indonesia."}, {"t": "moral", "text": "Jangan menyerah hanya karena gagal sekali. Mungkin kamu harus memperbaiki dirimu dan lebih berusaha lagi."}, {"t": "end"}]</script>

  function start(){
    // ---- pagination at a fixed base size; everything is sized in cqw so it scales ----
    var meas=document.createElement('div');meas.className='pg meas';
    meas.innerHTML='<div class="in"></div>';document.body.appendChild(meas);
    var inner=meas.firstChild;
    var pages=[],chapters=[];
    function fits(){return inner.scrollHeight<=inner.clientHeight+1}
    function flush(){ if(inner.innerHTML.trim()){pages.push({html:inner.innerHTML});} inner.innerHTML=''; }
    function pHTML(words,opt){
      var t=curly(words.join(' ')); var cls=[];
      if(opt.nc)cls.push('nc'); if(opt.first)cls.push('first'); if(/^“/.test(t)&&!opt.nc)cls.push('dlg');
      var body=esc(t);
      if(opt.dc){ body='<span class="dc">'+body.charAt(0)+'</span>'+body.slice(1); }
      return '<p'+(cls.length?' class="'+cls.join(' ')+'"':'')+'>'+body+'</p>';
    }
    function addPara(text,opt){
      var words=text.split(' '); opt=opt||{};
      var guard=0;
      while(words.length&&guard++<50){
        var before=inner.innerHTML;
        inner.insertAdjacentHTML('beforeend',pHTML(words,opt));
        if(fits())return;
        inner.innerHTML=before;
        var lo=0,hi=words.length-1;
        while(lo<hi){
          var mid=Math.ceil((lo+hi)/2);
          inner.insertAdjacentHTML('beforeend',pHTML(words.slice(0,mid),opt));
          var ok=fits(); inner.innerHTML=before;
          if(ok)lo=mid; else hi=mid-1;
        }
        if(lo>0){
          inner.insertAdjacentHTML('beforeend',pHTML(words.slice(0,lo),opt));
          words=words.slice(lo); opt={nc:true};
        }
        flush();
      }
    }
    var firstAfterHead=false;
    story.forEach(function(t){
      if(t.t==='part'){
        flush();
        chapters.push({n:NUM[t.n]||t.n,title:t.title,at:pages.length});
        inner.insertAdjacentHTML('beforeend','<div class="ch"><div class="chn">'+(NUM[t.n]||t.n)+'</div><h2>'+esc(t.title)+'</h2><div class="rule"></div></div>');
        firstAfterHead=true;
      }else if(t.t==='sub'){
        var b=inner.innerHTML; inner.insertAdjacentHTML('beforeend','<div class="sub">'+esc(t.text)+'</div>');
        if(!fits()){inner.innerHTML=b;flush();inner.insertAdjacentHTML('beforeend','<div class="sub">'+esc(t.text)+'</div>');}
      }else if(t.t==='sep'){
        inner.insertAdjacentHTML('beforeend','<div class="sep">* * *</div>');
      }else if(t.t==='p'){
        addPara(t.text,firstAfterHead?{dc:true,first:true}:{}); firstAfterHead=false;
      }else if(t.t==='ill'){
        var d=ILL[t.id]; var h='<figure class="ill"><div class="fr">'+d.svg()+'</div><figcaption>'+esc(d.cap)+'</figcaption></figure>';
        var b0=inner.innerHTML; inner.insertAdjacentHTML('beforeend',h);
        if(!fits()){inner.innerHTML=b0;flush();inner.insertAdjacentHTML('beforeend',h);}
      }else if(t.t==='moral'){
        flush();
        pages.push({html:'<div class="moral" style="position:absolute"><div class="mk">Pesan cerita</div><blockquote>'+esc(curly(t.text))+'</blockquote><div class="end">~ WILL BE CONTINUED ~</div></div>',moral:true});
      }
    });
    flush(); meas.remove();

    // ---- assemble pages: 0 cover, 1 title, 2 contents, 3.. story, [blank], back ----
    var list=[];
    function page(cls,html){list.push({cls:cls,html:html})}
    page('hard','<img alt="Sampul: Impian yang Hampir Gagal" src="'+COVER+'">');
    page('paper','<div class="title"><div class="k">KARYA ILMIAH</div><h1>Impian yang<span>Hampir Gagal</span></h1><div class="rule"></div><div class="sub2">Almost Giving Up on My Dream</div><div class="by">Ditulis oleh<span class="nm">Muhammad Ghazi Nabil</span><span class="sch">Grade 6 · SD Prima Sakinah Islamic School<br>Pembimbing: Ms. Arsi Binawanti, S.Psi., M.Pd.</span></div></div>');
    var base=3;
    var tocItems=chapters.map(function(c){return '<li><button type="button" data-go="'+(base+c.at)+'"><span class="no">'+c.n.replace('Bab ','')+'</span><span class="tt">'+esc(c.title)+'</span><span class="dots"></span><span class="pn">'+(base+c.at)+'</span></button></li>'}).join('');
    page('paper','<div class="toc"><h3>Daftar Isi</h3><ol>'+tocItems+'</ol></div>');
    pages.forEach(function(p,i){
      page('paper',(p.moral?p.html:'<div class="in">'+p.html+'</div>')+'<div class="fo">'+(base+i)+'</div>');
    });
    if((list.length+1)%2) page('paper','<div class="blank">★</div>');
    page('hard','<div class="back"><div class="frame"></div><div class="txt"><div class="st">★ ★ ★</div><h4>Jangan menyerah<span><br>hanya karena gagal sekali</span></h4><p>Perjuangan Galang baru dimulai.</p></div><div class="ft">Karya Ilmiah · SD Prima Sakinah Islamic School<br>Tahun Ajaran 2026–2027</div><svg viewBox="0 0 800 180" preserveAspectRatio="none" aria-hidden="true"><path d="M0 60Q100 20 200 60T400 60T600 60T800 60V180H0Z" fill="#2cc5d9" opacity=".95"/><path d="M0 105Q100 70 200 105T400 105T600 105T800 105V180H0Z" fill="#1491c4"/><path d="M0 145Q100 115 200 145T400 145T600 145T800 145V180H0Z" fill="#06335f"/></svg></div>');

    if(location.hash==='#print'){
      document.body.style.cssText='display:block;overflow:visible;padding:0;background:#fff';
      ['stage','bar','hint','load'].forEach(function(id){var e=document.getElementById(id);if(e)e.remove()});
      list.forEach(function(p,i){var d=document.createElement('div');d.className='pg '+p.cls;d.style.cssText='width:210mm;height:297mm;page-break-after:always;break-after:page;position:relative;overflow:hidden;background:'+(p.cls==='hard'?'#071a3a':'#f8f9fc');d.innerHTML=p.html;document.body.appendChild(d)});
      return;
    }
    var book=document.getElementById('book');
    list.forEach(function(p,i){
      var d=document.createElement('div');
      d.className='pg '+p.cls+(p.cls==='paper'?(i%2?' L':' R'):'');
      if(p.cls==='hard')d.setAttribute('data-density','hard');
      d.innerHTML=p.html; book.appendChild(d);
    });

    var pf=new St.PageFlip(book,{width:550,height:778,size:'stretch',minWidth:300,maxWidth:1100,minHeight:424,maxHeight:1560,
      showCover:true,usePortrait:true,maxShadowOpacity:.45,drawShadow:true,flippingTime:850,mobileScrollSupport:false,autoSize:true,startPage:0});
    pf.loadFromHTML(document.querySelectorAll('#book .pg'));
    var total=list.length;
    var info=document.getElementById('info'),prev=document.getElementById('prev'),next=document.getElementById('next'),first=document.getElementById('first');
    function upd(){
      var i=pf.getCurrentPageIndex(),land=pf.getOrientation()==='landscape',txt;
      if(i===0)txt='Sampul depan';
      else if(i>=total-1)txt='Sampul belakang';
      else if(land){ var l=i%2?i:i-1; txt='Halaman '+l+'–'+(l+1); } else txt='Halaman '+i;
      info.textContent=txt;
      prev.disabled=i===0; first.disabled=i===0; next.disabled=i>=total-1;
    }
    pf.on('flip',upd); pf.on('changeOrientation',upd); upd();
    prev.onclick=function(){pf.flipPrev()}; next.onclick=function(){pf.flipNext()}; first.onclick=function(){pf.flip(0)};
    document.getElementById('toc').onclick=function(){pf.flip(2)};
    book.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-go]');if(b){pf.flip(+b.getAttribute('data-go'))}});
    document.addEventListener('keydown',function(e){if(e.key==='ArrowRight')pf.flipNext();else if(e.key==='ArrowLeft')pf.flipPrev();});
    document.getElementById('load').hidden=true;
    setTimeout(function(){var h=document.getElementById('hint');if(h)h.style.opacity=0},6000);
  }
  var fonts=['400 16px "Courier Prime"','700 16px "Courier Prime"','700 16px "Poppins"','600 16px "Poppins"','italic 400 16px "Lora"'];
  Promise.all(fonts.map(function(f){return document.fonts.load(f)})).catch(function(){}).then(function(){return document.fonts.ready}).then(start,start);
})();
</script>
